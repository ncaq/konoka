name: Claude Code Review

on:
  pull_request:
    # デフォルトのイベントには`ready_for_review`と`reopened`が含まれますが、
    # `synchronize`イベントによって既にレビューを受けているのに、
    # 別のイベントで同じリビジョンに対して再度レビューが発生することが納得できないので、
    # `opened`と`synchronize`だけにしています。
    types: [opened, synchronize]

jobs:
  claude-review:
    # その時の最新のLinuxランナーを利用してください。
    runs-on: ubuntu-24.04

    # ハングしたときのために念の為タイムアウトを設定しています。
    timeout-minutes: 30

    env:
      # `CLAUDE_CODE_OAUTH_TOKEN`がセットされているかどうかを判定することで、
      # 設定の変更などでトークンが利用できなくなった場合を判断しやすくしています。
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

    permissions:
      checks: read # CIの結果を参考に出来ます。
      contents: read # レビューのためにリポジトリの内容を読めます。
      discussions: read # 議論を参考に出来ます。
      id-token: write # Claude Code Actionが動作するのに必要です。
      issues: read # 課題や議論を参考に出来ます。
      pages: read # 既存のドキュメントを参考に出来ます。
      pull-requests: write # レビューコメントをプルリクエストに書き込むために必要です。
      repository-projects: read # スケジュールを参考に出来ます。
      security-events: read # 脆弱性情報を参考に出来ます。

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 50 # git logなどで多少過去の文脈を参考に出来るようにするため、ある程度の履歴を取ってきます。
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@88c168b39e7e64da0286d812b6e9fbebb6708185 # v1.0.82
        # トークンが存在しない場合はスキップします。
        if: env.HAS_CLAUDE_TOKEN == 'true'
        # トークンが存在しない場合などで動かないことがありますが、
        # それをPR一覧でチェックが失敗している扱いしたくないので、
        # 内部で失敗しても全体では成功したと騙しています。
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # マーケットプレイスを認識させます。
          plugin_marketplaces: "https://github.com/ncaq/konoka.git"
          # 利用プラグインを指定します。
          plugins: "kyosei@konoka"
          # 通常のClaude Codeがセットアップするレビュープラグインではなく、Kyoseiプラグインを利用するための指定です。
          prompt: "/kyosei REPO:${{ github.repository }} PR_NUMBER:${{ github.event.pull_request.number }}"
          # botだからといって人間のコミットと危険性は特に変わらないはずなので許可します。
          allowed_bots: "*"
          # その時最適なモデルを切り替えて使用してください。
          # allowed-toolsはエージェントが使いそうなツールを広く列挙しています。
          # mcpでうまくインラインコメントが取得できないときもあるのでgh apiも許可しています。
          # 考慮しすぎるとキリがないので割り切ってある程度Claude Codeを信用して広く許可しています。
          claude_args: >-
            --model "opus[1m]"
            --allowed-tools "
            Bash(gh api *issues/*/comments*),
            Bash(gh api *pulls/*/comments*),
            Bash(gh api *pulls/*/reviews*),
            Bash(gh issue:*),
            Bash(gh pr:*),
            Bash(gh search:*),
            Glob,
            Grep,
            Read,
            WebFetch,
            WebSearch,
            mcp__github,
            mcp__github_inline_comment__create_inline_comment
            "
